name: Windows build

on:
  push:
    branches: [dev, main, feat/issue-10]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :game-client:jpackageImage
      - run: >
          game-client\build\jpackage\Roastlands\runtime\bin\java.exe
          -cp "game-client\build\jpackage\Roastlands\app\*"
          io.github.mfedenko09.roastlands.game.PackedContentCheck content
      - uses: actions/upload-artifact@v4
        with:
          name: roastlands-windows
          path: game-client/build/jpackage/
          if-no-files-found: error
