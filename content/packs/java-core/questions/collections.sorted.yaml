- id: collections.sorted.treeset-uses-comparator-not-equals
  topic: collections.sorted
  type: CODE_OUTPUT
  difficulty: 2
  keyPoint: 0
  prompt: What does this code print?
  code: |
    import java.util.Set;
    import java.util.TreeSet;

    public class Main {
        public static void main(String[] args) {
            Set<String> names = new TreeSet<>(String.CASE_INSENSITIVE_ORDER);
            names.add("ann");
            names.add("ANN");
            System.out.println(names.size());
            System.out.println(names.contains("Ann"));
        }
    }
  options:
    - output: "1\ntrue"
    - output: "2\ntrue"
    - output: "2\nfalse"
    - output: "1\nfalse"
  correct: 0
  explanation: >-
    A TreeSet decides whether an element is present with the comparator, not with equals. "ann", "ANN" and "Ann"
    compare as 0, so they are the same element.
  reference: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/TreeSet.html

- id: collections.sorted.treemap-null-key
  topic: collections.sorted
  type: CODE_OUTPUT
  difficulty: 2
  keyPoint: 0
  prompt: What happens with this code?
  code: |
    import java.util.Map;
    import java.util.TreeMap;

    public class Main {
        public static void main(String[] args) {
            Map<String, String> map = new TreeMap<>();
            map.put("a", "x");
            map.put(null, "y");
            System.out.println(map.size());
        }
    }
  options:
    - output: "2"
    - output: "1"
    - exception: java.lang.NullPointerException
    - compileError: true
  correct: 2
  explanation: >-
    The natural ordering calls compareTo on the key, and null cannot be compared. HashMap allows one null key,
    but a TreeMap without a null-friendly comparator does not.
  reference: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/TreeMap.html

- id: collections.sorted.not-comparable
