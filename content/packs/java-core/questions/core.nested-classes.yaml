- id: core.nested-classes.captured-variable-changes
  topic: core.nested-classes
  type: CODE_OUTPUT
  difficulty: 2
  keyPoint: 2
  prompt: What does this code do?
  code: |
    public class Main {
        public static void main(String[] args) {
            int count = 0;
            Runnable printer = () -> System.out.println(count);
            count++;
            printer.run();
        }
    }
  options:
    - output: "0"
    - output: "1"
    - compileError: true
  correct: 2
  explanation: >-
    A lambda or an inner class can only use local variables that are effectively final. count is changed by
    count++, so the capture is rejected at compile time. The lambda would copy the value, not share the variable.
  reference: JLS §15.27.2

- id: core.nested-classes.shadowed-field-outer-this
  topic: core.nested-classes
  type: CODE_OUTPUT
  difficulty: 2
  keyPoint: 0
  prompt: What does this code print?
  code: |
    public class Main {
        private int x = 1;

        class Inner {
            private int x = 2;

            void print(int x) {
                System.out.println(x + " " + this.x + " " + Main.this.x);
            }
        }

        public static void main(String[] args) {
            new Main().new Inner().print(3);
        }
    }
  options:
    - output: "3 2 1"
    - output: "3 3 3"
    - output: "1 2 3"
    - compileError: true
  correct: 0
  explanation: >-
    The parameter shadows the field of Inner, and that field shadows the field of Main. Shadowing is not an error.
    this.x is the field of Inner, and Main.this.x reaches the outer instance that every inner object holds.
  reference: JLS §15.8.4

- id: core.nested-classes.inner-keeps-outer-reachable
  topic: core.nested-classes
  type: TRUE_FALSE
  difficulty: 2
  keyPoint: 0
  prompt: >-
    True or false: while an instance of a non-static inner class is reachable, its outer instance cannot be
    collected by the garbage collector.
  correct: true
  explanation: >-
    An inner object is created with an immediately enclosing instance, and it can use that instance at any time,
    so the outer object stays reachable. It does not matter that the inner code never reads an outer field. This
    is how a long-lived inner object can leak a big outer object. A static nested class has no such link.
  reference: JLS §15.9.2

- id: core.nested-classes.static-nested-reads-instance-field
  topic: core.nested-classes
  type: CODE_OUTPUT
  difficulty: 1
  keyPoint: 1
  prompt: What does this code do?
  code: |
    public class Main {
        private int count = 1;

        static class Counter {
            int read() {
                return count;
            }
        }

        public static void main(String[] args) {
            System.out.println(new Counter().read());
        }
    }
  options:
    - output: "1"
    - output: "0"
    - exception: java.lang.NullPointerException
    - compileError: true
  correct: 3
  explanation: >-
    A static nested class has no outer instance, so count, an instance field of Main, cannot be named from it.
    Being nested does give access to private members, but only through a Main object, for example a parameter.
    This is checked by the compiler, so no default value is read and no NullPointerException can happen.
  reference: JLS §8.1.3

- id: core.nested-classes.anonymous-and-lambda-this
  topic: core.nested-classes
  type: CODE_OUTPUT
  difficulty: 3
  keyPoint: 3
  prompt: What does this code print?
  code: |
    public class Main {
        @Override
        public String toString() {
            return "outer";
        }

        void run() {
            Runnable lambda = () -> System.out.println(this);
            Runnable anonymous = new Runnable() {
                @Override
                public void run() {
                    System.out.println(this);
                }

                @Override
                public String toString() {
                    return "anonymous";
                }
            };
            lambda.run();
            anonymous.run();
        }

        public static void main(String[] args) {
            new Main().run();
        }
    }
  options:
    - output: "outer\nanonymous"
    - output: "outer\nouter"
    - output: "anonymous\nanonymous"
    - compileError: true
  correct: 0
  explanation: >-
    A lambda body has no this of its own: it means the same as in the enclosing method, so the Main object.
    An anonymous class is a real class, so this inside it is the anonymous object. It is easy to treat a lambda as
    a short form of an anonymous class, but they differ here.
  reference: JLS §15.27.2

- id: core.nested-classes.lambda-redeclares-local
  topic: core.nested-classes
  type: CODE_OUTPUT
  difficulty: 2
  keyPoint: 3
  prompt: What does this code do?
  code: |
    public class Main {
        public static void main(String[] args) {
            int value = 1;
            Runnable task = () -> {
                int value = 2;
                System.out.println(value);
            };
            task.run();
            System.out.println(value);
        }
    }
  options:
    - output: "2\n1"
    - output: "2\n2"
    - output: "1\n1"
    - compileError: true
  correct: 3
  explanation: >-
    A lambda body is in the same scope as the enclosing method, so declaring value again is a duplicate variable.
    The same declaration inside a method of an anonymous class compiles and shadows the outer variable, and that
    is where the wrong answer 2 and 1 comes from.
  reference: JLS §15.27.2

- id: core.nested-classes.new-inner-from-static-main
  topic: core.nested-classes
  type: CODE_OUTPUT
  difficulty: 1
  keyPoint: 4
  prompt: What does this code do?
  code: |
    public class Main {
        class Inner {
            String name() {
                return "inner";
            }
        }

        public static void main(String[] args) {
            Inner inner = new Inner();
            System.out.println(inner.name());
        }
    }
  options:
    - output: "inner"
    - exception: java.lang.NullPointerException
    - compileError: true
  correct: 2
  explanation: >-
    Inner is not static, so it needs an enclosing Main instance, and a static method has no this to use. The compiler
    rejects it, so the code never gets to run with a null outer. The fix is new Main().new Inner(), or to make the
    class static.
  reference: JLS §15.9.2

- id: core.nested-classes.outer-new-inner-binds-instance
  topic: core.nested-classes
  type: CODE_OUTPUT
  difficulty: 2
  keyPoint: 4
  prompt: What does this code print?
  code: |
    public class Main {
        private final String name;

        Main(String name) {
            this.name = name;
        }

        class Inner {
            String owner() {
                return name;
            }
        }

        public static void main(String[] args) {
            Main first = new Main("first");
            Main second = new Main("second");
            Main.Inner one = first.new Inner();
            Main.Inner two = second.new Inner();
            System.out.println(one.owner() + " " + two.owner());
        }
    }
  options:
    - output: "first second"
    - output: "second second"
    - output: "null null"
    - compileError: true
  correct: 0
  explanation: >-
    The expression before .new gives the enclosing instance, so each Inner object is tied to its own Main object.
    The inner class is declared once, but name is not shared between Inner objects. It is read from the instance
    each one was created with, so the last created Main does not win.
  reference: JLS §15.9.2
